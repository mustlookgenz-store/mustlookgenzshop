function handleProfilePicSelect(ev){
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')){ toast('শুধু ইমেজ ফাইল সিলেক্ট করুন', 'err'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxSize = 400;
      let w = img.width, h = img.height;
      if (w > h){ if (w > maxSize){ h = Math.round(h * maxSize / w); w = maxSize; } }
      else { if (h > maxSize){ w = Math.round(w * maxSize / h); h = maxSize; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      S.profilePic = dataUrl;
      save();
      const prev = $('#picPreview');
      if (prev) prev.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover">`;
      persistProfilePic(dataUrl);
      toast('ছবি সফলভাবে আপলোড হয়েছে ✅', 'ok');
      setTimeout(()=>{ closeSheet(); render(); renderDrawer(); }, 800);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
window.handleProfilePicSelect = handleProfilePicSelect;

async function persistProfilePic(dataUrl){
  try {
    if (db && S.user?.uid){
      await db.collection('users').doc(S.user.uid).set({ photoURL: dataUrl, updatedAt: Date.now() }, { merge: true });
    }
  } catch(e){ console.warn('Persist profile pic failed:', e); }
}

function removeProfilePic(){
  S.profilePic = null;
  save();
  const prev = $('#picPreview');

}

/* 🆕 Handle pending order after successful auth */
function handlePendingOrderAfterAuth(){
  if (!pendingOrderAfterAuth) return;
  pendingOrderAfterAuth = false;
  if (pendingOrderResumeTimer){ clearTimeout(pendingOrderResumeTimer); pendingOrderResumeTimer = null; }
 
  // Show success message
  toast('✓ লগইন সফল — অর্ডার সম্পন্ন হচ্ছে...', 'ok');
 
  // Make sure we're on checkout page
  const page = parseHash().parts[0];
  if (page !== 'checkout'){
    S.checkout.step = 4;
    save();
    go('/checkout');
  }
 
  // Wait a moment for Firebase Auth to fully propagate, then auto-place order
  pendingOrderResumeTimer = setTimeout(() => {
    if (S.user && S.user.uid){
      placeOrder();
    } else {
      toast('⚠️ লগইন সম্পন্ন হয়নি — আবার চেষ্টা করুন', 'err');
    }
    pendingOrderResumeTimer = null;
  }, 900);
}
window.handlePendingOrderAfterAuth = handlePendingOrderAfterAuth;

async function doGoogleLogin(){
  if (!auth || !googleProvider) { toast('Auth সার্ভিস উপলব্ধ নেই', 'err'); return; }
  try {
    const result = await auth.signInWithPopup(googleProvider);
    const user = result.user;
    S.user = { uid: user.uid, email: user.email, displayName: user.displayName };
    if (user.photoURL && !S.profilePic) S.profilePic = user.photoURL;
    try {
      if (db) await db.collection('users').doc(user.uid).set({
        uid: user.uid, email: user.email, displayName: user.displayName,
        photoURL: user.photoURL || '',
        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    } catch(e){}
    save(); closeSheet(); render(); renderDrawer();
    startUserOrdersListener(user.uid);
   
    // 🆕 Auto-continue pending order
    handlePendingOrderAfterAuth();
   
    // Only show toast if not auto-continuing
    if (!pendingOrderAfterAuth) toast('সফলভাবে গুগল লগইন হয়েছে 🎉', 'ok');
  } catch(e){
    console.error('[Google Login]', e);
    if (e.code === 'auth/popup-closed-by-user') toast('লগইন বাতিল করা হয়েছে', 'err');
    else toast(friendlyAuthError(e), 'err');
  }
}
window.doGoogleLogin = doGoogleLogin;

async function doLogin(){
  const email = $('#authEmail').value.trim();
  const pass = $('#authPass').value;
  if (!email){ toast('ইমেইল দিন', 'err'); return; }
  if (pass.length < 6){ toast('পাসওয়ার্ড কমপক্ষে ৬ অক্ষর', 'err'); return; }
  if (!auth) { toast('Auth সার্ভিস উপলব্ধ নেই', 'err'); return; }
  try {
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    let pic = S.profilePic;
    try {
      if (db){
        const userDoc = await db.collection('users').doc(cred.user.uid).get();
        if (userDoc.exists && userDoc.data().photoURL) pic = userDoc.data().photoURL;
      }
    } catch(e){}
    S.user = { uid: cred.user.uid, email: cred.user.email, displayName: cred.user.displayName || email.split('@')[0] };
    if (pic) S.profilePic = pic;
    save(); closeSheet(); render(); renderDrawer();
    startUserOrdersListener(cred.user.uid);
   
    // 🆕 Auto-continue pending order
    handlePendingOrderAfterAuth();
   
    if (!pendingOrderAfterAuth) toast('সফলভাবে লগইন হয়েছে 🎉', 'ok');
  } catch(e){
    console.error('[Login]', e);
    toast(friendlyAuthError(e), 'err');
  }
}
window.doLogin = doLogin;

async function doSignup(){
  const name = $('#authName').value.trim();
  const email = $('#authEmail').value.trim();
  const pass = $('#authPass').value;
  if (!name){ toast('নাম লিখুন', 'err'); return; }
  if (!email){ toast('ইমেইল দিন', 'err'); return; }
  if (pass.length < 6){ toast('পাসওয়ার্ড কমপক্ষে ৬ অক্ষর', 'err'); return; }
  if (!auth) { toast('Auth সার্ভিস উপলব্ধ নেই', 'err'); return; }
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await cred.user.updateProfile({ displayName: name });
    S.user = { uid: cred.user.uid, email: cred.user.email, displayName: name };
    try {
      if (db) await db.collection('users').doc(cred.user.uid).set({
        uid: cred.user.uid, email, displayName: name,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    } catch(e){}
    save(); closeSheet(); render(); renderDrawer();
    startUserOrdersListener(cred.user.uid);
   
    // 🆕 Auto-continue pending order
    handlePendingOrderAfterAuth();
   
    if (!pendingOrderAfterAuth) toast('অ্যাকাউন্ট তৈরি হয়েছে 🎉', 'ok');
  } catch(e){
    console.error('[Signup]', e);
    toast(friendlyAuthError(e), 'err');
  }
}
window.doSignup = doSignup;

async function doLogout(){
  if (!confirm('লগআউট করতে চান?')) return;
  try { if (auth) await auth.signOut(); } catch(e){}
  if (ordersListener){ try { ordersListener(); } catch(e){} ordersListener = null; }
  if (chatListener){ try { chatListener(); } catch(e){} chatListener = null; }
  S.user = null; S.profilePic = null; S.orders = []; save(); render(); renderDrawer();
  toast('লগআউট সম্পন্ন');
}
window.doLogout = doLogout;

function saveChatPhone(){
  const phone = ($('#chatPhoneInput')?.value || '').trim();
  if (!/^01[3-9]\d{8}$/.test(phone)){ toast('সঠিক ১১ ডিজিটের নম্বর দিন', 'err'); return; }
  if (S.addresses.length === 0){
    S.addresses.push({ name: S.user?.displayName || 'কাস্টমার', phone, district:'', thana:'', area:'', address:'', tag:'চ্যাট' });
  }
  save();
  closeSheet();
  go('/chat');
  toast('চ্যাট শুরু হয়েছে', 'ok');
}
window.saveChatPhone = saveChatPhone;

function afterChatPage(){
  const phone = getChatPhone();
  if (!phone) return;
  const ta = $('#chatInput');
  if (ta){
    ta.addEventListener('input', () => {
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 100) + 'px';
    });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
    });
  }
  startChatListener(phone);
}

function startChatListener(phone){
  if (chatListener){ try { chatListener(); } catch(e){} chatListener = null; }
  if (!db) return;
  try {
    chatListener = db.collection('chats').doc(phone).collection('messages')
      .orderBy('createdAt', 'asc').limit(200)
      .onSnapshot(snap => {
        const box = $('#chatMsgs');
        if (!box) return;
        const msgs = [];
        snap.forEach(d => msgs.push({ id: d.id, ...d.data() }));
        if (msgs.length === 0){
          box.innerHTML = `<div style="text-align:center;color:var(--muted);padding:30px;font-size:13px">
            👋 আসসালামু আলাইকুম!<br>আমাদের সাথে চ্যাট শুরু করুন।<br>সাধারণত ৫-১০ মিনিটের মধ্যে রিপ্লাই পাবেন।
          </div>`;
          return;
        }
        box.innerHTML = msgs.map(m => {
          const t = m.createdAt ? new Date(m.createdAt).toLocaleString('bn-BD', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
          if (m.system){
            return `<div class="chat-bubble system">${esc(m.text)}<small>${t}</small></div>`;
          }
          const side = m.from === 'customer' ? 'me' : 'them';
          return `<div class="chat-bubble ${side}">${esc(m.text)}<small>${m.from === 'customer' ? 'আপনি' : 'সাপোর্ট'} · ${t}</small></div>`;
        }).join('');
        box.scrollTop = box.scrollHeight;
        db.collection('chats').doc(phone).set({ unreadByCustomer: 0 }, { merge: true }).catch(()=>{});
      }, err => {
        console.warn('[Chat] listener error:', err);
      });
  } catch(e){
    console.warn('[Chat] start error:', e);
  }
}

async function sendChat(){
  const phone = getChatPhone();
  if (!phone){ toast('ফোন নম্বর যোগ করুন', 'err'); openChatPhoneSheet(); return; }
  const ta = $('#chatInput');
  if (!ta) return;
  const text = ta.value.trim();
  if (!text) return;
  ta.value = '';
  ta.style.height = 'auto';
  try {
    const chatRef = db.collection('chats').doc(phone);
    await chatRef.collection('messages').add({
      text, from: 'customer', createdAt: Date.now()
    });
    await chatRef.set({
      customerName: S.user?.displayName || S.addresses[0]?.name || 'কাস্টমার',
      customerEmail: S.user?.email || '',
      phone,
      lastMessage: text,
      lastMessageAt: Date.now(),
      lastMessageFrom: 'customer',
      unreadByAdmin: firebase.firestore.FieldValue.increment(1),
      updatedAt: Date.now()
    }, { merge: true });
  } catch(e){
    console.error('[Chat] send error:', e);
    toast('মেসেজ পাঠানো যায়নি', 'err');
  }
}
window.sendChat = sendChat;

/* ==========================================================================
   🚀 LOAD FROM FIRESTORE
   ========================================================================== */
async function loadFromFirestore(){
  try {
    const productsSnap = await db.collection('products').get();
    const products = [];
    productsSnap.forEach(doc => {
      const data = doc.data();
      products.push({
        id: doc.id,
        ...data,
        createdAt: data.createdAt?.toMillis ? data.createdAt.toMillis() : (typeof data.createdAt === 'number' ? data.createdAt : 0)
      });
    });
    products.sort((a,b)=>(b.createdAt || 0) - (a.createdAt || 0));
    ALL_PRODUCTS = products;

    try {
      const bannersSnap = await db.collection('banners').get();
      HERO_BANNERS = [];
      bannersSnap.forEach(doc => HERO_BANNERS.push({ id: doc.id, ...doc.data() }));
      HERO_BANNERS.sort((a,b)=>(a.order || 0) - (b.order || 0));
    } catch(e){ HERO_BANNERS = []; }

    try {
      const catSnap = await db.collection('categories').get();
      const remoteCats = [];
      catSnap.forEach(doc => {
        const d = doc.data();
        if (d.name && d.name !== 'সব' && !remoteCats.find(c => c.id === doc.id)){
          remoteCats.push({ id: doc.id, name: d.name, order: d.order ?? 99, image: d.image || '', emoji: d.emoji || '📦', color: d.color || '#f5f5f5' });
        }
      });
      remoteCats.sort((a,b) => (a.order ?? 99) - (b.order ?? 99));
      ALL_CATEGORIES = remoteCats;
    } catch(e){ ALL_CATEGORIES = []; }

    try {
      const setSnap = await db.collection('settings').doc('store').get();
      if (setSnap.exists){
        settings = Object.assign({}, DEFAULT_SETTINGS, setSnap.data());
      }
      applySettings();
      try { localStorage.setItem('shopbd_settings', JSON.stringify(settings)); } catch(e){}
    } catch(e){ console.warn('[Settings] load error:', e); }

    try {
      const couponSnap = await db.collection('coupons').get();
      COUPONS = {};
      couponSnap.forEach(doc => { COUPONS[doc.id] = doc.data(); });
    } catch(e){ COUPONS = {}; }

  } catch(err){
    console.error('[Firestore] load error:', err);
    try {
      const cached = JSON.parse(localStorage.getItem('shopbd_settings') || 'null');
      if (cached){ settings = Object.assign({}, DEFAULT_SETTINGS, cached); applySettings(); }
    } catch(e){}
  } finally {
    const loader = $('#loadingOverlay');
    if (loader) setTimeout(()=>loader.classList.add('hide'), 300);
    renderDrawer();
  }
}

function startProductListener(){
  if (productListener){ try { productListener(); } catch(e){} productListener = null; }
  if (!db) return;
  try {
    productListener = db.collection('products').onSnapshot(snap => {
      const products = [];
      snap.forEach(doc => {
        const data = doc.data();
        products.push({
          id: doc.id,
          ...data,
          createdAt: data.createdAt?.toMillis ? data.createdAt.toMillis() : (typeof data.createdAt === 'number' ? data.createdAt : 0)
        });
      });
      products.sort((a,b)=>(b.createdAt || 0) - (a.createdAt || 0));
      ALL_PRODUCTS = products;
      const page = parseHash().parts[0];
      if (['home','category','search','product'].includes(page)){
        if (page === 'product'){
          const currentId = parseHash().parts[1];
          const fresh = products.find(p => p.id === currentId);
          if (fresh && $('#pdBar')){
            /* silently update */
          }
        } else {
          render();
        }
      }
    }, err => {
      console.warn('[Products] realtime error:', err);
    });
  } catch(e){
    console.warn('[Products] start error:', e);
  }
}

/* Real-time user orders listener */
function startUserOrdersListener(uid){
  if (ordersListener){ try { ordersListener(); } catch(e){} ordersListener = null; }
  if (!db || !uid) return;
  try {
    ordersListener = db.collection('orders')
      .where('userId', '==', uid)
      .onSnapshot(snap => {
        const arr = [];
        snap.forEach(doc => {
          const d = doc.data();
          arr.push({
            ...d,
            id: doc.id,
            createdAt: d.createdAt?.toMillis ? d.createdAt.toMillis() : (typeof d.createdAt === 'number' ? d.createdAt : Date.now()),
            updatedAt: d.updatedAt?.toMillis ? d.updatedAt.toMillis() : (typeof d.updatedAt === 'number' ? d.updatedAt : Date.now())
          });
        });
        arr.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
        S.orders = arr;
        save();

        arr.forEach(o => {
          const prev = prevOrderStatusMap[o.id];
          if (prev && prev !== o.status){
            const label = {
              pending:'⏳ পেন্ডিং', confirmed:'✓ কনফার্মড',
              processing:'⚙️ প্রসেসিং', shipped:'🚚 শিপড',
              out:'🛵 ডেলিভারিতে', delivered:'📬 ডেলিভার্ড',
              cancelled:'❌ বাতিল'
            }[o.status] || o.status;
            toast(`অর্ডার ${o.id}: ${label}`, o.status === 'cancelled' ? 'err' : 'ok');
          }
          if (o.paymentTrxStatus === 'rejected' && prevOrderStatusMap[o.id + '_trx'] !== 'rejected'){
            toast(`⚠️ অর্ডার ${o.id}: TrxID বাতিল`, 'err');
            prevOrderStatusMap[o.id + '_trx'] = 'rejected';
          } else if (o.paymentTrxStatus === 'verified' && prevOrderStatusMap[o.id + '_trx'] !== 'verified'){
            toast(`✅ অর্ডার ${o.id}: পেমেন্ট ভেরিফাইড`, 'ok');
            prevOrderStatusMap[o.id + '_trx'] = 'verified';
          }
          prevOrderStatusMap[o.id] = o.status;
        });

        const page = parseHash().parts[0];
        if (['orders','order','success','account'].includes(page)) render();
      }, err => {
        console.warn('[UserOrders] listener error:', err);
      });
  } catch(e){
    console.warn('[UserOrders] start error:', e);
  }
}

/* ==========================================================================
   🚀 INIT
   ========================================================================== */
async function init(){
  FB.init();
  applySettings();

  setTimeout(() => {
    const loader = $('#loadingOverlay');
    if (loader && !loader.classList.contains('hide')) loader.classList.add('hide');
  }, 4000);

  if (auth){
    auth.onAuthStateChanged(async user => {
      if (user){
        S.user = { uid: user.uid, email: user.email, displayName: user.displayName || (user.email||'').split('@')[0] };
        try {
          if (db){
            const doc = await db.collection('users').doc(user.uid).get();
            if (doc.exists && doc.data().photoURL) S.profilePic = doc.data().photoURL;
          }
        } catch(e){}
        save();
        renderDrawer();
        startUserOrdersListener(user.uid);
      } else {
        renderDrawer();
        if (ordersListener){ try { ordersListener(); } catch(e){} ordersListener = null; }
        prevOrderStatusMap = {};
      }
    });
  }

  if (db){
    await loadFromFirestore();
    startProductListener();
  } else {
    const loader = $('#loadingOverlay');
    if (loader) setTimeout(()=>loader.classList.add('hide'), 300);
  }

  render();
  renderDrawer();

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeAll();
  });

  console.info('%c🚀 ' + brandTitle() + ' v5.1','color:#1a1a1a;font-weight:bold;font-size:14px', 'প্রস্তুত! Auth Wall সহ');
}

window.addEventListener('load', init);

/* ==========================================================================

window.ShopBD = {

  get settings(){ return settings; },
  get state(){ return S; },
  get products(){ return ALL_PRODUCTS; },
  get banners(){ return HERO_BANNERS; },
  get categories(){ return ALL_CATEGORIES; },
  get coupons(){ return COUPONS; },
  BD_DATA,
  isPartnerEnabled, brandTitle, applySettings,
  isLocalAddress, deliveryChargeEffective,
  fixImgUrl, getProductImage, getProductImages,
  addToCart, updateCartQty, removeFromCart, toggleWish, toggleCompare, searchProducts,

};
